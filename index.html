<!DOCTYPE html>
<html>
<head>
  <title>Flor y tallo</title>
  <style>
    /* Estilos para la flor */
    .flor {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 200px;
      height: 200px;
      border-radius: 50%;
      background-color: #ff69b4;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.2);
    }
    
    /* Estilos para el tallo */
    .tallo {
      position: absolute;
      top: 60%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 10px;
      height: 200px;
      background-color: #3e8e41;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.2);
    }
    
    /* Estilos para las hojas */
    .hoja {
      position: absolute;
      top: 80%;
      left: 45%;
      transform: translate(-50%, -50%);
      width: 50px;
      height: 50px;
      background-color: #3e8e41;
      border-radius: 50%;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.2);
    }
  </style>
</head>
<body>
  <div class="flor"></div>
  <div class="tallo"></div>
  <div class="hoja"></div>
</body>
</html>
